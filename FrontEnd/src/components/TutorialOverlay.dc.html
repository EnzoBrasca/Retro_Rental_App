<x-dc>
  <sc-if value="{{ tutorialActive }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;z-index:50;">
      <div style="position: absolute; border-radius: 14px; box-shadow: 0 0 0 3px #F5C518,0 0 0 9999px rgba(6,7,9,0.82); transition: all .35s cubic-bezier(.4,0,.2,1); top: {{ tutBox.top }}; left: {{ tutBox.left }}; width: {{ tutBox.width }}; height: {{ tutBox.height }};"></div>
      <div style="position: absolute; left: 2px; right: 2px; padding: 18px; background: #22262b; border: 1px solid #F5C518; border-radius: 15px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); animation: ff-fade .3s ease; transition: top .35s cubic-bezier(.4,0,.2,1); top: {{ tutCardTop }};">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;">
          <div style="font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#F5C518;font-weight:600;">{{ tutStepLabel }}</div>
          <div style="font-size:11px;color:#8A9099;cursor:pointer;" onClick="{{ endTutorial }}">Omitir ✕</div>
        </div>
        <div style="font-family:'Oswald',sans-serif;font-weight:600;font-size:18px;letter-spacing:0.5px;margin-bottom:6px;">{{ tutTitle }}</div>
        <div style="font-size:13px;color:#9AA0A6;line-height:1.5;margin-bottom:15px;">{{ tutText }}</div>
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div style="display:flex;gap:6px;">{{ tutDots }}</div>
          <button onClick="{{ tutNext }}" style="background:#F5C518;color:#101215;border:none;border-radius:9px;padding:9px 18px;font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;">{{ tutNextLabel }}</button>
        </div>
      </div>
    </div>
  </sc-if>
</x-dc>

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return this.props;
  }
}
</script>
