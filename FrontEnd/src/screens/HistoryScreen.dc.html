<x-dc>
  <div style="height:100%;overflow-y:auto;padding:16px 16px 118px;">
    <div style="font-family:'Oswald',sans-serif;font-weight:700;font-size:26px;letter-spacing:0.5px;margin-bottom:4px;">HISTORIAL</div>
    <div style="font-size:12px;color:#8A9099;margin-bottom:16px;">Registro de cargas de toda tu flota</div>

    <div style="display:flex;gap:8px;margin-bottom:18px;overflow-x:auto;">
      <div style="flex:0 0 auto;background:#F5C518;color:#101215;font-size:12px;font-weight:600;padding:7px 14px;border-radius:20px;">Todos</div>
      <div style="flex:0 0 auto;background:#1F2226;border:1px solid #2C3138;color:#9AA0A6;font-size:12px;padding:7px 14px;border-radius:20px;">Esta semana</div>
      <div style="flex:0 0 auto;background:#1F2226;border:1px solid #2C3138;color:#9AA0A6;font-size:12px;padding:7px 14px;border-radius:20px;">Verificados</div>
      <div style="flex:0 0 auto;background:#1F2226;border:1px solid #2C3138;color:#9AA0A6;font-size:12px;padding:7px 14px;border-radius:20px;">Pendientes</div>
    </div>

    <sc-for list="{{ history }}" as="h" hint-placeholder-count="6">
      <div style="background:#1F2226;border:1px solid #2A2F35;border-radius:13px;padding:13px 14px;margin-bottom:10px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;">
          <div style="display:flex;align-items:center;gap:9px;">
            <div style="width:36px;height:36px;border-radius:9px;background:#2A2F35;display:flex;align-items:center;justify-content:center;">
              <img src="src/assets/icons/{{ h.icon }}" style="width:20px;height:20px;filter:invert(1);opacity:0.8;" alt="Icon" />
            </div>
            <div>
              <div style="font-family:'Oswald',sans-serif;font-weight:500;font-size:14.5px;">{{ h.vehicle }}</div>
              <div style="font-size:11px;color:#8A9099;font-family:'IBM Plex Mono',monospace;">{{ h.date }}</div>
            </div>
          </div>
          <div style="font-size:10px;font-weight:600;padding:4px 9px;border-radius:20px;background:{{ h.statusBg }};color:{{ h.statusColor }};">{{ h.status }}</div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;border-top:1px solid #262b30;padding-top:9px;">
          <div style="font-size:11.5px;color:#9AA0A6;">{{ h.provider }} · <span style="font-family:'IBM Plex Mono',monospace;">{{ h.liters }}</span></div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;color:#E8E6E1;">{{ h.cost }}</div>
        </div>
      </div>
    </sc-for>
  </div>
</x-dc>

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return this.props;
  }
}
</script>
