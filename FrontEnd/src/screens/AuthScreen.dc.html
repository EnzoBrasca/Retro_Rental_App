<x-dc>
  <div style="position:absolute;inset:0;padding:64px 26px 26px;display:flex;flex-direction:column;background:linear-gradient(180deg,#16181B 0%,#191b1f 100%);">
    <div style="display:flex;align-items:center;gap:11px;margin-bottom:8px;">
      <div style="width:46px;height:46px;border-radius:10px;background:#F5C518;display:flex;align-items:center;justify-content:center;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M4 20V6a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v14" stroke="#101215" stroke-width="2" stroke-linecap="round"></path><path d="M15 10h2.5L20 12.5V18a1.5 1.5 0 0 1-3 0v-1H4" stroke="#101215" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="18.5" cy="7" r="1.4" fill="#101215"></circle></svg>
      </div>
      <div style="font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:1.5px;font-size:24px;">FUEL<span style="color:#F5C518;">TRACK</span></div>
    </div>
    <div style="font-size:13px;color:#8A9099;margin-bottom:26px;line-height:1.5;">Control de cargas de combustible para flotas y maquinaria vial.</div>

    <div style="display:flex;background:#1F2226;border-radius:11px;padding:4px;margin-bottom:22px;">
      <button onClick="{{ setLogin }}" style="{{ loginTabStyle }}">Iniciar sesión</button>
      <button onClick="{{ setRegister }}" style="{{ registerTabStyle }}">Registrarse</button>
    </div>

    <sc-if value="{{ isRegister }}" hint-placeholder-val="{{ true }}">
      <div style="margin-bottom:14px;">
        <div style="font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:#8A9099;margin-bottom:7px;">Nombre completo</div>
        <input value="Nuevo Operario" style="width:100%;height:48px;background:#22262b;border:1px solid #2E343B;border-radius:10px;padding:0 14px;color:#E8E6E1;font-size:15px;">
      </div>
    </sc-if>
    <div style="margin-bottom:14px;">
      <div style="font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:#8A9099;margin-bottom:7px;">Correo / Usuario</div>
      <input value="juan.perez@vialsur.com" style="width:100%;height:48px;background:#22262b;border:1px solid #2E343B;border-radius:10px;padding:0 14px;color:#E8E6E1;font-size:15px;">
    </div>
    <div style="margin-bottom:20px;">
      <div style="font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:#8A9099;margin-bottom:7px;">Contraseña</div>
      <input type="password" value="123456789" style="width:100%;height:48px;background:#22262b;border:1px solid #2E343B;border-radius:10px;padding:0 14px;color:#E8E6E1;font-size:15px;">
    </div>

    <button onClick="{{ doLogin }}" style="width:100%;height:52px;background:#F5C518;color:#101215;border:none;border-radius:11px;font-family:'Oswald',sans-serif;font-weight:600;font-size:16px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;box-shadow:0 8px 20px -6px rgba(245,197,24,0.5);">{{ authCta }}</button>
    <div style="text-align:center;font-size:12.5px;color:#6E747C;margin-top:16px;">¿Olvidaste tu contraseña?</div>

    <div style="margin-top:auto;display:flex;align-items:center;gap:10px;background:#1F2226;border:1px solid #2A2F35;border-radius:12px;padding:13px 15px;">
      <div style="width:34px;height:34px;border-radius:8px;background:#242a30;display:flex;align-items:center;justify-content:center;flex:0 0 auto;">🪖</div>
      <div style="font-size:11.5px;color:#9AA0A6;line-height:1.45;">Ingresá con las credenciales que te asignó el administrador de tu obra.</div>
    </div>
  </div>
</x-dc>

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return this.props;
  }
}
</script>
