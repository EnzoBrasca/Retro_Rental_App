<x-dc>
  <div style="height:100%;overflow-y:auto;padding:16px 16px 118px;">
    <div style="font-family:'Oswald',sans-serif;font-weight:700;font-size:26px;letter-spacing:0.5px;margin-bottom:16px;">PERFIL</div>
    <div style="display:flex;flex-direction:column;align-items:center;background:#1F2226;border:1px solid #2A2F35;border-radius:16px;padding:22px 16px 20px;margin-bottom:18px;">
      <div style="width:78px;height:78px;border-radius:50%;background:linear-gradient(135deg,#F5C518,#c99a00);display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-weight:700;font-size:30px;color:#101215;margin-bottom:12px;">JP</div>
      <div style="font-family:'Oswald',sans-serif;font-weight:600;font-size:20px;">Juan Pérez</div>
      <div style="font-size:12px;color:#8A9099;margin-top:2px;">Operario · Obra Ruta 33 Sur</div>
      <div style="margin-top:12px;background:#173d24;color:#5fd07f;font-size:11px;font-weight:600;padding:5px 12px;border-radius:20px;">✓ Cuenta verificada</div>
    </div>

    <div style="font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#6E747C;margin:0 4px 10px;">Datos personales</div>
    <div style="background:#1F2226;border:1px solid #2A2F35;border-radius:14px;overflow:hidden;margin-bottom:18px;">
      <sc-for list="{{ profileFields }}" as="f" hint-placeholder-count="4">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 15px;border-bottom:1px solid #262b30;">
          <div>
            <div style="font-size:10.5px;color:#8A9099;letter-spacing:0.5px;">{{ f.label }}</div>
            <div style="font-size:14px;margin-top:2px;">{{ f.value }}</div>
          </div>
          <div style="color:#F5C518;font-size:16px;">✎</div>
        </div>
      </sc-for>
    </div>

    <div style="background:#1F2226;border:1px solid #2A2F35;border-radius:14px;overflow:hidden;margin-bottom:18px;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 15px;border-bottom:1px solid #262b30;"><span style="font-size:14px;">🔔 Notificaciones</span><span style="color:#6E747C;">›</span></div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 15px;border-bottom:1px solid #262b30;"><span style="font-size:14px;">🌐 Idioma · Español</span><span style="color:#6E747C;">›</span></div>
      <div onClick="{{ startTutorial }}" style="display:flex;align-items:center;justify-content:space-between;padding:14px 15px;cursor:pointer;"><span style="font-size:14px;">🎓 Ver tutorial</span><span style="color:#6E747C;">›</span></div>
    </div>

    <button onClick="{{ doLogout }}" style="width:100%;height:50px;background:#241a1a;border:1px solid #4a2626;color:#ff6b6b;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;letter-spacing:0.5px;">Cerrar sesión</button>
    <div style="text-align:center;font-size:11px;color:#4d525a;margin-top:16px;">FuelTrack v1.0 · Vial Sur S.A.</div>
  </div>
</x-dc>

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return this.props;
  }
}
</script>
