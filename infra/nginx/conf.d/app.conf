# Reverse proxy de produccion. Unico servicio con puertos publicos.
#
# Rutea por subdominio:
#   api.tuapp.com   -> backend:8080  (la API que consume el mobile)
#   files.tuapp.com -> minio:9000    (descarga de fotos via URLs presignadas)
#
# Reemplaza "tuapp.com" por tu dominio real y coloca los certificados en
# infra/nginx/certs/ (ver docs/DEPLOYMENT.md).

# ---------------------------------------------------------------------------
# API del backend
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name api.tuapp.com;
    # Forzar HTTPS: todo el trafico plano se redirige.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.tuapp.com;

    ssl_certificate     /etc/nginx/certs/api.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/api.privkey.pem;

    # Crear un ticket sube 2 fotos (max-request-size 20MB en application.yml).
    # Dejamos margen para no cortar uploads legitimos.
    client_max_body_size 25m;

    location / {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------------------------------------------
# Almacenamiento MinIO (URLs presignadas)
#
# Las presigned URLs se firman con MINIO_PUBLIC_ENDPOINT=https://files.tuapp.com.
# nginx reenvia el Host original a MinIO para que la firma valide correctamente.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name files.tuapp.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name files.tuapp.com;

    ssl_certificate     /etc/nginx/certs/files.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/files.privkey.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://minio:9000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
