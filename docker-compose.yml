# Base compartida por TODOS los entornos.
#
# Define QUE servicios existen y como se comunican ENTRE ELLOS por la red interna
# de Docker (por nombre de servicio: postgres, minio). Es "seguro por defecto":
# NO publica ningun puerto al host ni asume acceso externo. Cada entorno agrega
# lo suyo encima:
#   - dev  -> docker-compose.override.yml (auto-mergeado por `docker compose up`)
#   - prod -> docker-compose.prod.yml (se activa explicitamente con -f)
#
# Este archivo NO se corre solo en la practica: siempre se combina con uno de los
# dos de arriba.
services:
  backend:
    build: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      postgres: { condition: service_healthy }
      minio:    { condition: service_healthy }

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 5

volumes:
  pgdata:
  miniodata:
