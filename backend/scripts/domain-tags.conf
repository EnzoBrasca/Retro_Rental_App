# Mapea archivos de backend/src/main a los @Tag de dominio usados en los
# tests (backend/src/test). Formato: regex=tag (una entrada por linea).
#
# El regex se evalua contra el path completo del archivo tocado, relativo a
# la raiz del repo. Un archivo puede matchear mas de un tag.
#
# Si test-affected.sh encuentra un archivo tocado que no matchea NINGUNA
# entrada de este mapa, cae al fallback de correr la suite completa: es
# preferible correr de mas a dejar pasar un dominio no tageado.
Ticket=ticket
ConsumoCalculator=ticket
ImageValidator=ticket
Vehiculo=vehiculo
TipoVehiculo=vehiculo
Herramienta=herramienta
Stats=stats
Habilitado=habilitado
(Auth|Jwt|RateLimit|SecurityConfig|Persona)=auth
# --------------------------------------------------------------------------
# Agregado junto con EmpleadoServiceTest, que es el que lo respalda (ver
# docs/BACKEND-AUDIT.md, TST-01 e INF-02). Antes el dominio `empleado` no
# existia, asi que tocar EmpleadoService caia al fallback de suite completa.
#
# REGLA para agregar entradas nuevas acá: el tag tiene que existir en la suite.
# Un tag sin tests que lo respalden es PEOR que no tener la entrada, porque
# cambia un fallback honesto ("no se que cubre esto, corro todo") por un falso
# verde ("corri el dominio", que estaba vacio).
#
# Por eso NO se mapean `Precio` ni `Proveedor`: PrecioService y ProveedorService
# siguen sin tests propios, asi que se los deja caer al fallback a proposito.
# Cuando tengan tests tageados, se agregan aca.
# --------------------------------------------------------------------------
Empleado=empleado

# --------------------------------------------------------------------------
# Servicios extraidos de TicketService en la fase 2. El mapeo NO va por el
# nombre del archivo sino por DONDE VIVE SU COBERTURA: los tres se ejercen
# desde TicketServiceTest (y AnalyzeSinTransaccionTest), que llevan @Tag
# ("ticket").
#
# VehiculoConsumo es el caso que obliga a ser explicito: matchea `Vehiculo` y
# por lo tanto ya corria el dominio `vehiculo`, que NO lo cubre. Sin esta linea,
# tocarlo daba verde habiendo corrido los tests equivocados — un miss, que es
# el unico error que este script no puede permitirse.
# --------------------------------------------------------------------------
PrecioCatalogo=ticket
VehiculoConsumo=ticket
CatalogoOcr=ticket
