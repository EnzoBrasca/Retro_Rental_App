# Mapea archivos de backend/src/main a los @Tag de dominio usados en los
# tests (backend/src/test). Formato: regex=tag (una entrada por linea).
#
# El regex se evalua contra el path completo del archivo tocado, relativo a
# la raiz del repo. Un archivo puede matchear mas de un tag.
#
# Si test-affected.sh encuentra un archivo tocado que no matchea NINGUNA
# entrada de este mapa, cae al fallback de correr la suite completa: es
# preferible correr de mas a dejar pasar un dominio no tageado.
Ticket=ticket
ConsumoCalculator=ticket
ImageValidator=ticket
Vehiculo=vehiculo
TipoVehiculo=vehiculo
Herramienta=herramienta
Stats=stats
Habilitado=habilitado
(Auth|Jwt|RateLimit|SecurityConfig|Persona)=auth
