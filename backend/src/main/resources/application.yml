spring:
  application:
    name: retro-rental-app
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    # La URL se arma por partes: en Docker, DB_HOST=postgres (nombre del
    # servicio en la red de compose). Para correr local sin Docker, el default
    # localhost alcanza. DB_NAME es el MISMO valor que usa POSTGRES_DB, así no
    # hay forma de que la URL apunte a una base que no existe.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

app:
  jwt:
    secret: ${JWT_SECRET}            # sin default → obligatoria (mín. 32 caracteres)
    expiration: ${JWT_EXPIRATION:3600000}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET:tickets}

server:
  port: ${SERVER_PORT:8080}
