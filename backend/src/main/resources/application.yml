spring:
  application:
    name: retro-rental-app
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # Pool EXPLICITO. Antes no se configuraba nada y quedaba el default de Hikari
    # (10 conexiones) por omision, no por decision — y ese numero era el
    # multiplicador que volvia critico a TX-01: diez analisis de OCR simultaneos
    # se llevaban el pool entero y dejaban sin conexiones al login, los listados
    # y las estadisticas.
    #
    # Con el OCR y las subidas ya fuera de las transacciones, cada conexion se
    # sostiene por lo que dura una consulta. 10 sigue siendo suficiente y ahora
    # es una eleccion escrita: quien la cambie sabe contra que la esta cambiando.
    #
    # Postgres tiene max_connections=100 por defecto: subir esto sin mirar ese
    # techo (y sin contar las conexiones que se lleva el pooler si algun dia se
    # agrega) mueve el problema, no lo resuelve.
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      # Si una conexion no se consigue en este tiempo, se falla rapido con un
      # error claro en vez de dejar el request colgado.
      connection-timeout: 5000
      # Reciclado preventivo: evita quedarse con conexiones que el servidor o un
      # firewall intermedio ya dieron por muertas.
      max-lifetime: 900000
      idle-timeout: 300000
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          # Agrupa los INSERT/UPDATE del mismo tipo en un solo viaje. Hoy rinde
          # poco porque casi todo son escrituras de a una; queda puesto para
          # cuando los saveAll de DB-07/DB-08 reemplacen los bucles de guardado.
          batch_size: 30
        order_inserts: true
        order_updates: true
  # El schema lo construye Flyway, en TODOS los entornos. Hibernate solo lo
  # valida (ver ddl-auto en los perfiles): cualquier cambio de estructura va en
  # un archivo nuevo de db/migration, nunca automatico.
  flyway:
    enabled: true
    locations: classpath:db/migration
    # La DB arranca vacia y Flyway la construye desde V1. Si alguna vez hay que
    # adoptar una base preexistente, se activa baseline-on-migrate a conciencia.
    baseline-on-migrate: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

app:
  jwt:
    secret: ${JWT_SECRET}
    # 30 dias (2592000000 ms). Antes 1h: el cliente pidio no tener que
    # reloguearse cada hora, solo una vez al mes.
    expiration: ${JWT_EXPIRATION:2592000000}
  consumo:
    # Cuantas cargas mira el consumo "reciente" del vehiculo, ademas del
    # historico completo. Comparar uno contra otro deja ver cuando una maquina
    # se desvia de su propio promedio, que suele anticipar una falla.
    ventana-cargas: ${CONSUMO_VENTANA_CARGAS:10}
  precio:
    # Cuanto puede alejarse del precio vigente un precio corregido a mano por el
    # empleado, o leido por OCR, antes de considerarse un error de carga.
    # Freno contra el cero de mas y contra el OCR que lee 2.086 como 20.860.
    #
    # En la carga manual, pasarse corta la operacion con 409. En el OCR se
    # descarta el valor y se conserva el vigente, sin trabar al empleado.
    margen-maximo: ${PRECIO_MARGEN_MAXIMO:30}
  rate-limit:
    # Freno de fuerza bruta sobre POST /auth/login (ver LoginRateLimitFilter).
    # Ventana fija por IP: pasados max-attempts intentos dentro de
    # window-seconds, se responde 429 hasta que la ventana vence.
    # El default deja margen para que alguien se equivoque varias veces sin
    # quedar afuera, pero corta cualquier intento de probar contrasenas en masa.
    login:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:10}
      window-seconds: ${LOGIN_WINDOW_SECONDS:60}
    # Freno de consumo sobre POST /tickets/analyze (ver AnalyzeRateLimitFilter).
    # Ventana fija por USUARIO autenticado, no por IP: los empleados cargan
    # desde el campo con datos moviles y varios comparten la IP de salida de la
    # operadora, asi que limitar por IP castigaria a companeros que no hicieron
    # nada.
    #
    # 20 por hora deja muchisimo margen para el uso real (un empleado carga un
    # punado de tickets por dia, y cada uno se analiza una vez), pero corta en
    # seco un bucle: sin esto, cada llamada es un OCR PAGO de Mistral.
    analyze:
      max-attempts: ${ANALYZE_MAX_ATTEMPTS:20}
      window-seconds: ${ANALYZE_WINDOW_SECONDS:3600}

mistral:
  # API key de Mistral (console.mistral.ai). Sin ella, el cliente no se crea y el
  # analisis de tickets queda inactivo (la app arranca igual).
  api-key: ${MISTRAL_API_KEY:}
  # Host base de la API de Mistral.
  base-url: ${MISTRAL_BASE_URL:https://api.mistral.ai}
  # Modelo de OCR para leer la foto del ticket.
  model: ${MISTRAL_MODEL:mistral-ocr-latest}
  # Timeout de cada request al modelo, en segundos.
  timeout-seconds: ${MISTRAL_TIMEOUT_SECONDS:30}
  # Mamparo: cuantos analisis pueden estar en vuelo AL MISMO TIEMPO.
  # No es un limite de uso (de eso se ocupa app.rate-limit.analyze), sino un
  # tope de concurrencia. Sin el, el limite real seria el pool de hilos de
  # Tomcat: 200 llamadas simultaneas = 200 hilos bloqueados hasta 30s y 200
  # imagenes en base64 en memoria, y la API deja de responder para todo lo
  # demas. Con el tope, la saturacion del OCR se queda en un 503 de ESE
  # endpoint y el resto de la app sigue en pie.
  max-concurrent: ${MISTRAL_MAX_CONCURRENT:5}
  # Cuanto espera un analisis a que se libere un lugar antes de rendirse con
  # 503. Corto a proposito: mejor que el empleado cargue a mano que dejarlo
  # esperando con un hilo del servidor retenido.
  acquire-timeout-seconds: ${MISTRAL_ACQUIRE_TIMEOUT_SECONDS:5}

minio:
  # Endpoint interno: lo usa el backend para operar contra MinIO.
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  # Endpoint publico: host con el que se firman las URLs presignadas para que un
  # cliente externo (app mobile) pueda descargarlas. Por defecto, igual al interno.
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET:tickets}
  # Validez de las URLs presignadas, en segundos (por defecto 1 hora).
  presigned-expiry-seconds: ${MINIO_PRESIGNED_EXPIRY:3600}

server:
  port: ${SERVER_PORT:8080}
  # Detras de nginx, request.getRemoteAddr() devolveria siempre la IP del
  # contenedor del proxy. Con esto Spring lee X-Forwarded-For / X-Forwarded-Proto
  # (nginx los envia) y el rate limit de login cuenta por IP REAL del cliente;
  # sin esto todos los usuarios compartirian un unico contador y el primer
  # atacante bloquearia a todo el mundo.
  #
  # Confiar en esos headers es seguro aca porque el backend no publica puertos
  # en produccion: el unico camino hacia el es nginx, que los reescribe.
  forward-headers-strategy: framework
