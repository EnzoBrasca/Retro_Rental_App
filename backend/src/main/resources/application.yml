spring:
  application:
    name: retro-rental-app
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  # El schema lo construye Flyway, en TODOS los entornos. Hibernate solo lo
  # valida (ver ddl-auto en los perfiles): cualquier cambio de estructura va en
  # un archivo nuevo de db/migration, nunca automatico.
  flyway:
    enabled: true
    locations: classpath:db/migration
    # La DB arranca vacia y Flyway la construye desde V1. Si alguna vez hay que
    # adoptar una base preexistente, se activa baseline-on-migrate a conciencia.
    baseline-on-migrate: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:3600000}
  precio:
    # Cuanto puede alejarse del precio vigente un precio corregido a mano por el
    # empleado, o leido por OCR, antes de considerarse un error de carga.
    # Freno contra el cero de mas y contra el OCR que lee 2.086 como 20.860.
    #
    # En la carga manual, pasarse corta la operacion con 409. En el OCR se
    # descarta el valor y se conserva el vigente, sin trabar al empleado.
    margen-maximo: ${PRECIO_MARGEN_MAXIMO:30}
  rate-limit:
    # Freno de fuerza bruta sobre POST /auth/login (ver LoginRateLimitFilter).
    # Ventana fija por IP: pasados max-attempts intentos dentro de
    # window-seconds, se responde 429 hasta que la ventana vence.
    # El default deja margen para que alguien se equivoque varias veces sin
    # quedar afuera, pero corta cualquier intento de probar contrasenas en masa.
    login:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:10}
      window-seconds: ${LOGIN_WINDOW_SECONDS:60}

mistral:
  # API key de Mistral (console.mistral.ai). Sin ella, el cliente no se crea y el
  # analisis de tickets queda inactivo (la app arranca igual).
  api-key: ${MISTRAL_API_KEY:}
  # Host base de la API de Mistral.
  base-url: ${MISTRAL_BASE_URL:https://api.mistral.ai}
  # Modelo de OCR para leer la foto del ticket.
  model: ${MISTRAL_MODEL:mistral-ocr-latest}
  # Timeout de cada request al modelo, en segundos.
  timeout-seconds: ${MISTRAL_TIMEOUT_SECONDS:30}

minio:
  # Endpoint interno: lo usa el backend para operar contra MinIO.
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  # Endpoint publico: host con el que se firman las URLs presignadas para que un
  # cliente externo (app mobile) pueda descargarlas. Por defecto, igual al interno.
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET:tickets}
  # Validez de las URLs presignadas, en segundos (por defecto 1 hora).
  presigned-expiry-seconds: ${MINIO_PRESIGNED_EXPIRY:3600}

server:
  port: ${SERVER_PORT:8080}
  # Detras de nginx, request.getRemoteAddr() devolveria siempre la IP del
  # contenedor del proxy. Con esto Spring lee X-Forwarded-For / X-Forwarded-Proto
  # (nginx los envia) y el rate limit de login cuenta por IP REAL del cliente;
  # sin esto todos los usuarios compartirian un unico contador y el primer
  # atacante bloquearia a todo el mundo.
  #
  # Confiar en esos headers es seguro aca porque el backend no publica puertos
  # en produccion: el unico camino hacia el es nginx, que los reescribe.
  forward-headers-strategy: framework
