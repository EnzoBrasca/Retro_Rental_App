spring:
  jpa:
    hibernate:
      # Igual que prod: el schema lo construye Flyway y Hibernate solo verifica
      # que las entidades coincidan. Si agregas un campo, va en una migracion
      # nueva; si no, la app no arranca y te enteras aca y no en produccion.
      ddl-auto: validate
    show-sql: true
logging:
  level:
    org.hibernate.SQL: DEBUG
    com.retrorental.backend: DEBUG