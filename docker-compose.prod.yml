# Entorno de PRODUCCION.
#
# NO se aplica solo: hay que activarlo EXPLICITAMENTE combinandolo con el base
# (asi Compose ignora el override.yml de dev):
#
#   docker compose --env-file .env.production \
#     -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# La PRIMERA vez, antes de esto, hay que emitir los certificados TLS:
#   ./infra/scripts/init-letsencrypt.sh
#
# Diferencias clave con dev:
#   - Ningun servicio de datos (postgres/minio) expone puertos al host.
#   - El backend TAMPOCO se publica directo: el unico con puertos al host es el
#     reverse proxy (nginx, 80/443). Todo lo demas vive solo en la red interna.
#   - restart: unless-stopped para sobrevivir reinicios del servidor.
services:
  backend:
    env_file: .env.production
    environment:
      # Se impone ACA y no en el .env a proposito, igual que DB_HOST en el base:
      # es critico e invariable, y olvidarlo es silencioso y grave. El default de
      # application.yml es `dev`, y con el perfil dev activo en produccion
      # correria DataSeeder (@Profile("dev")) sembrando proveedores y precios de
      # prueba en la base del cliente, ademas de logging en DEBUG.
      SPRING_PROFILES_ACTIVE: prod
    restart: unless-stopped
    # SIN ports: inalcanzable desde afuera salvo a traves de nginx.

  postgres:
    restart: unless-stopped
    # SIN ports: la base nunca se expone. Solo el backend la toca por la red.

  minio:
    restart: unless-stopped
    # SIN ports: se accede solo via nginx (subdominio de archivos).

  # Reverse proxy: unico punto de entrada publico. Termina TLS y rutea por
  # subdominio hacia el backend y hacia MinIO (para las URLs presignadas).
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      # Limita envsubst a las variables APP_*: sin esto se comeria tambien las
      # variables propias de nginx ($host, $scheme...) y romperia la config.
      NGINX_ENVSUBST_FILTER: "^APP_"
    volumes:
      - ./infra/nginx/templates:/etc/nginx/templates:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - backend
      - minio
    # OJO CON ESTE command: el entrypoint de la imagen solo procesa
    # /etc/nginx/templates cuando su primer argumento es "nginx". Como aca el
    # comando empieza con "sh" (hace falta para el bucle de recarga), hay que
    # invocar el entrypoint A MANO o app.conf nunca se genera y nginx arranca
    # con la config por defecto de la imagen: la API responde 404 en todo,
    # incluido el challenge de Let's Encrypt.
    #
    # La recarga periodica toma los certificados renovados. Sin ella nginx
    # seguiria sirviendo el viejo desde memoria hasta el proximo reinicio, y se
    # venceria igual que si no hubiera renovacion.
    command:
      - sh
      - -c
      - |
        /docker-entrypoint.sh nginx -v
        rm -f /etc/nginx/conf.d/default.conf
        while :; do sleep 6h & wait $${!}; nginx -s reload; done &
        exec nginx -g 'daemon off;'

  # Renovacion automatica de los certificados de Let's Encrypt (duran 90 dias).
  # La EMISION inicial no la hace este servicio: la hace init-letsencrypt.sh,
  # porque requiere una secuencia de arranque especial (ver ese script).
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do
               certbot renew --webroot -w /var/www/certbot;
               sleep 12h & wait $${!};
             done"

volumes:
  letsencrypt:
  certbot-www:
